# Data Cleaning Configuration
# This file defines cleaning templates and site-specific mappings

# ============================================================================
# TEMPLATES - Reusable cleaning configurations
# ============================================================================

template_wordpress:
  delivery_version: v1
  domain_fallback: 'daily life'
  subdomain_fallback: 'practical tips/advice/guide'
  type_fallback: 'article'

  # Pre-processing filters (applied before cleaning)
  pre_filter:
    # Drop records matching these URL patterns
    re_url:
      - '/contact/'
      - '/about/'
      - '/privacy-policy/'
      - '/terms-of-service/'

    # Minimum cleaned body length (characters)
    body_length: 200

  # Cleaning pipeline configuration
  clean:
    # Enabled cleaning steps (applied in order)
    enabled:
      - clean_html          # Extract text from HTML with trafilatura
      - clean_title         # Clean title text
      - normalize_unicode   # Normalize unicode and map smart punctuation
      - clean_emoji         # Remove emojis
      - clean_whitespace    # Normalize whitespace
      - anonymization       # Anonymize email addresses
      - clean_punctuation   # Clean excessive punctuation
      - english_only        # Drop if content is not English

    # Cleaning arguments
    args:
      # XPath selector to apply before extraction (null = use full HTML)
      body_xpath: null

      # XPath expressions to prune/remove
      noises:
        - //header[@class='site-header']
        - //*[contains(@class,'breadcrumbs')]
        - //*[contains(@class,'breadcrumb')]
        - //*[contains(@class,'share')]
        - //*[contains(@class,'social')]
        - //*[contains(@class,'newsletter')]
        - //*[contains(@class,'subscribe')]
        - //*[contains(@class,'cookie')]
        - //*[contains(@class,'gdpr')]
        - //*[contains(@class,'related-posts')]
        - //*[contains(@class,'post-navigation')]
        - //*[contains(@class,'site-banner')]
        - //*[contains(@class,'top-bar')]
        - //*[contains(@class, 'ad')]
        - //*[contains(@class, 'read_also')]
        - //*[contains(@class, 'read-also')]
        - //*[contains(translate(@class,'TAXONOMY','taxonomy'),'taxonomy')]
        - //*[contains(translate(@class,'BADGE','badge'),'badge')]
        - //*[contains(translate(@class,'MARKETING','marketing'),'marketing')]
        - //*[contains(translate(@class,'CTA','cta'),'cta')]
        - //*[contains(translate(@class,'CALL-TO-ACTION','call-to-action'),'call-to-action')]
        - //*[contains(translate(@class,'PROMOTIONAL','promotional'),'promotional')]
        - //*[contains(translate(@class,'NEXT-POST','next-post'),'next-post')]
        - //*[contains(translate(@class,'PREV-POST','prev-post'),'prev-post')]
        - //*[contains(translate(@class,'AUTHOR-BIO','author-bio'),'author-bio')]
        - //*[contains(translate(@class,'ABOUT-AUTHOR','about-author'),'about-author')]
        - //*[contains(translate(@class,'BYLINE','byline'),'byline')]
        - //*[contains(translate(text(),'CONTACT ME','contact me'),'contact me')]
        - //*[contains(translate(text(),'CONTACT US','contact us'),'contact us')]
        - //*[contains(translate(text(),'GET IN TOUCH','get in touch'),'get in touch')]
        - //*[contains(translate(@class,'COMMENT','comment'),'comment')]
        - //*[contains(translate(@class,'DISCUSSION','discussion'),'discussion')]
        - //*[contains(translate(@id,'COMMENT','comment'),'comment')]
        - //*[contains(translate(@id,'DISQUS','disqus'),'disqus')]
        - //*[contains(translate(@class,'APP','app'),'app-')]
        - //*[contains(translate(@class,'APP','app'),'-app')]
        - //*[contains(translate(@class,'DOWNLOAD','download'),'download')]
        - //*[contains(translate(@class,'MOBILE','mobile'),'mobile-app')]
        - //*[contains(translate(@id,'APP','app'),'app-')]
        - //*[contains(translate(@id,'DOWNLOAD','download'),'download')]
        - //*[contains(translate(text(),'DOWNLOAD','download'),'download our app')]
        - //*[contains(translate(text(),'DOWNLOAD','download'),'download the app')]
        - //*[contains(translate(text(),'GET THE APP','get the app'),'get the app')]
        - //*[contains(translate(@class,'AD','ad'),'ad-')]
        - //*[contains(translate(@class,'AD','ad'),'-ad')]
        - //*[contains(translate(@class,'ADVERTISEMENT','advertisement'),'advertisement')]
        - //*[contains(translate(@class,'SPONSORED','sponsored'),'sponsored')]
        - //*[contains(translate(@class,'PROMO','promo'),'promo')]
        - //*[contains(translate(@id,'AD','ad'),'ad-')]
        - //*[contains(translate(@id,'ADVERTISEMENT','advertisement'),'advertisement')]
        - //*[contains(translate(text(),'ADVERTISEMENT','advertisement'),'advertisement')]
        - //*[contains(translate(text(),'SPONSORED','sponsored'),'sponsored content')]
        - //*[contains(translate(@class,'RELATED','related'),'related')]
        - //*[contains(translate(@class,'RECOMMENDED','recommended'),'recommended')]
        - //*[contains(translate(@class,'READ-ALSO','read-also'),'read-also')]
        - //*[contains(translate(@class,'READ_ALSO','read_also'),'read_also')]
        - //*[contains(translate(@class,'READMORE','readmore'),'readmore')]
