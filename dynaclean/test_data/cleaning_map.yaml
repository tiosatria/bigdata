
template_wordpress:
  delivery_version: v1
  domain_fallback: 'daily life'
  subdomain_fallback: 'living'
  type_fallback: 'article'

  pre_filter:
    re_url:
      - '/contact/'
      - '/about/'
    body_length: 100  # Lower threshold for testing

  clean:
    enabled:
      - clean_html
      - clean_title
      - clean_emoji
      - clean_whitespace
      - anonymization
      - clean_punctuation
      - english_only

    args:
      body_xpath: null
      noises:
        - //script
        - //aside
      formating:
        retain_table: true
        retain_image: true

  post_filter:
    re_cleaned_text: []
    re_title: []
    domain_containing: []
    subdomain_containing: []

domain_mapping:
  mindoverclutter.ca:
    domain: 'lifestyle'
    subdomain: 'organizing'

site_mapping:
  mindoverclutter_ca:
    delivery_version: v1
    clean:
      type: 'template_wordpress'
