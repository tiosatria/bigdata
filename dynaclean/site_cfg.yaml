CONFIG_VERSION: 1

GLOBAL:
  workers: 12
  limit: 0

  key_mapping:
    id: <uuid4>
    text: <title>\n<body>
    meta:
      data_info:
        url: metadata.url
        lang: @en
        source: metadata.sitename
        type: @article
        processing_date: metadata.date
        delivery_version: @v1
        title: metadata.title
      content_info:
        domain: metadata.categories[:first] or metadata.tags[:last] or <meta.content_info.fallbacks.domain>
        subdomain: metadata.tags[:first] or <meta.content_info.fallbacks.subdomain>

  meta:
    data_info:
      fallbacks:
        lang: en
        type: site article
        processing_date: '2021-01-01'
        delivery_version: v1
      specify:
        lang: null
        type: null
        processing_date: null
        delivery_version: null
    content_info:
      fallbacks:
        domain: daily life
        subdomain: living
      specify:
        domain: null
        subdomain: null

  paths:
    input: "${DATA_ROOT}/input"
    dedupe: "${DATA_ROOT}/dedupe"
    output: "${DATA_ROOT}/output"
    logs: "${DATA_ROOT}/logs"

  validation:
    min_text_length: 200

  filters:
    exclude:
      url:
        - "(?i)about"
        - "(?i)contact"
        - "(?i)privacy"
        - "(?i)terms"
      domain: null
    include:
      url: null
      domain: null

  cleaning_pipeline:
    - name: url_dedupe_and_filtering
      enabled: true
      params:
        use_default: true
        regex_filter:
          - "/about/?$"
          - "/contact/?"
          - "/privacy/?"
          - "/terms/?"

    - name: html_body_cleaning
      enabled: true
      params:
        use_default_noises: true
        noises:
          - "//script"
          - "//style"
          - "//head"
          - "//footer"
          - "//header"
          - "//nav"
          - "//aside"
          - "//form"
          - "//input"
          - "//button"
        retain_table: true
        retain_image: true
        body_xpath: null

    - name: emoji_cleaning
      enabled: false

    - name: anonymization
      enabled: false

    - name: non_latin
      enabled: true

    - name: whitespace
      enabled: true

    - name: zero_width_space
      enabled: true

    - name: html_unescape
      enabled: false

    - name: title_site_template
      enabled: true

    - name: english_only_filter
      enabled: true

SITES:
  default:
    inherit: GLOBAL

  joyoushealth:
    inherit: GLOBAL
    overrides:
      filters:
        exclude:
          url:
            - "(?i)recipes"
            - "(?i)podcast"
      cleaning_pipeline:
        - name: html_body_cleaning
          params:
            retain_image: false
            body_xpath: "//div[@class='main-content']"

  feastingonfruit:
    inherit: GLOBAL
    overrides:
      validation:
        min_text_length: 400
      filters:
        exclude:
          title:
            - 'some regex pattern'