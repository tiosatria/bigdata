        - //*[contains(translate(@id,'GDPR','gdpr'),'gdpr')]
        - //*[contains(translate(@id,'CONSENT','consent'),'consent')]
        - //*[contains(translate(@class,'NEWSLETTER','newsletter'),'newsletter')]
        - //*[contains(translate(@class,'SUBSCRIBE','subscribe'),'subscribe')]
        - //*[contains(translate(@class,'SIGNUP','signup'),'signup')]
        - //*[contains(translate(@class,'SIGN-UP','sign-up'),'sign-up')]
        - //*[contains(translate(@id,'NEWSLETTER','newsletter'),'newsletter')]
        - //*[contains(translate(@id,'SUBSCRIBE','subscribe'),'subscribe')]
        - //*[contains(translate(text(),'SUBSCRIBE','subscribe'),'subscribe to')]
        - //*[contains(translate(text(),'NEWSLETTER','newsletter'),'newsletter')]
        - //*[contains(translate(text(),'EMAIL','email'),'get email')]
        - //*[contains(translate(@class,'SHARE','share'),'share')]
        - //*[contains(translate(@class,'SOCIAL','social'),'social')]
        - //*[contains(translate(@class,'FOLLOW','follow'),'follow')]
        - //*[contains(translate(@id,'SHARE','share'),'share')]
        - //*[contains(translate(@id,'SOCIAL','social'),'social')]
        - //*[contains(translate(text(),'SHARE','share'),'share this')]
        - //*[contains(translate(text(),'FOLLOW','follow'),'follow us')]
        - //*[contains(translate(@class,'BADGE','badge'),'badge')]
        - //*[contains(translate(@class,'LABEL','label'),'label')]
        - //*[contains(translate(@class,'TAG','tag'),'tag') and contains(translate(@class,'CLOUD','cloud'),'cloud')]

      # formatting options
      formating:
        retain_table: true
        retain_image: true
        retain_links: false


  # Post-processing filters (applied after cleaning)
  post_filter:
    # Drop if cleaned text matches these patterns
    re_cleaned_text:
      - '.*nsfw.*'
      - '.*explicit content.*'

    # Drop if title matches these patterns
    re_title:
      - '(?i).*podcast.*'
      - '(?i).*\[sponsored\].*'
      - '(?i).*webinar.*'
      - '(?i).*livestream.*'
      - '(?i).*live stream.*'
      - '(?i).*event.*registration.*'
      - '(?i).*infographic.*'
      - '(?i).*press release.*'
      - '(?i).*announcement.*'

    # Drop if domain contains these terms
    domain_containing: []

    # Drop if subdomain contains these terms
    subdomain_containing: []


